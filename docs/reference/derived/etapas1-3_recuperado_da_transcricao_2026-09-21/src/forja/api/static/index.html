<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Forja KCM — Edge</title>
<link rel="stylesheet" href="/ui/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙</text></svg>">
</head>
<body>

<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<!-- ───────────────────────── Cabeçalho ───────────────────────── -->
<header class="topo" id="topo">
  <div class="topo__esq">
    <button class="menu-botao" id="menuBotao" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav">
      <span class="menu-botao__risco"></span>
      <span class="menu-botao__risco"></span>
      <span class="menu-botao__risco"></span>
    </button>
    <div class="marca">
      <span class="marca__nome">Forja</span>
      <span class="marca__sub" id="equipamentoTag">—</span>
    </div>
  </div>

  <div class="topo__dir">
    <!-- Origem do dado: a informação mais importante da tela.
         Nunca deixar dúvida se o número é de uma máquina real. -->
    <span class="selo selo--origem" id="seloOrigem" hidden></span>
    <span class="selo" id="seloConexao">
      <span class="pulso" aria-hidden="true"></span>
      <span id="textoConexao">conectando</span>
    </span>
  </div>
</header>

<!-- ───────────────────────── Navegação ───────────────────────── -->
<div class="sombra-drawer" id="sombraDrawer" hidden></div>

<nav class="nav" id="nav" aria-label="Seções">
  <button class="nav__item is-ativo" data-aba="painel">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    <span>Painel</span>
  </button>
  <button class="nav__item" data-aba="tendencias">
    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3,17 9,11 13,15 21,6"/><polyline points="15,6 21,6 21,12"/></svg>
    <span>Tendências</span>
  </button>
  <button class="nav__item" data-aba="eventos">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3Z"/><line x1="12" y1="10" x2="12" y2="14"/><circle cx="12" cy="17" r="1"/></svg>
    <span>Eventos</span>
    <span class="nav__contador" id="contadorEventos" hidden>0</span>
  </button>
  <button class="nav__item" data-aba="maquina">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="16" x2="13" y2="16"/></svg>
    <span>Máquina</span>
  </button>
</nav>

<main id="conteudo">

  <!-- ───────────────── Painel ───────────────── -->
  <section class="aba is-ativa" id="aba-painel" aria-label="Painel">
    <div class="faixa-aviso" id="faixaAviso" hidden></div>

    <div class="cartoes" id="cartoes">
      <div class="carregando">carregando leituras…</div>
    </div>

    <section class="bloco">
      <h2 class="bloco__titulo">Aquisição</h2>
      <div class="medidores" id="medidores"></div>
    </section>
  </section>

  <!-- ───────────────── Tendências ───────────────── -->
  <section class="aba" id="aba-tendencias" aria-label="Tendências" hidden>
    <div class="barra-ferramentas">
      <div class="segmentado" id="janelaTempo" role="group" aria-label="Janela de tempo">
        <button data-min="5" class="is-ativo">5 min</button>
        <button data-min="15">15 min</button>
        <button data-min="60">1 h</button>
      </div>
      <button class="botao botao--fantasma" id="recarregarTend">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21,3 21,9 15,9"/></svg>
        Atualizar
      </button>
    </div>
    <div class="graficos" id="graficos"></div>
  </section>

  <!-- ───────────────── Eventos ───────────────── -->
  <section class="aba" id="aba-eventos" aria-label="Eventos" hidden>
    <div class="barra-ferramentas">
      <div class="segmentado" id="filtroEventos" role="group" aria-label="Filtro de eventos">
        <button data-filtro="todos" class="is-ativo">Todos</button>
        <button data-filtro="abertos">Abertos</button>
      </div>
      <span class="contagem" id="contagemEventos"></span>
    </div>
    <div class="lista-eventos" id="listaEventos">
      <div class="carregando">carregando eventos…</div>
    </div>
  </section>

  <!-- ───────────────── Máquina ───────────────── -->
  <section class="aba" id="aba-maquina" aria-label="Máquina" hidden>
    <div class="ficha" id="ficha"></div>
  </section>

</main>

<!-- ───────────────── Painel lateral do diagnóstico ───────────────── -->
<div class="sombra-painel" id="sombraPainel" hidden></div>
<aside class="diagnostico" id="diagnostico" aria-label="Diagnóstico" hidden>
  <header class="diagnostico__topo">
    <div>
      <span class="diagnostico__tipo" id="diagTipo"></span>
      <h2 class="diagnostico__titulo" id="diagResumo"></h2>
    </div>
    <button class="fechar" id="fecharDiag" aria-label="Fechar diagnóstico">
      <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </header>
  <div class="diagnostico__corpo" id="diagCorpo"></div>
</aside>

<div class="rodape-origem" id="rodapeOrigem" hidden></div>

<script src="/ui/js/graficos.js"></script>
<script src="/ui/js/app.js"></script>
</body>
</html>
