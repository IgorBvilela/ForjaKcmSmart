# Biblioteca de diagnostico: pouco material sobre a correia (Documento Mestre §18.1; spec §39-40).
# Hipoteses sao "Comportamento compativel com..." e nunca afirmam causa. Cada item tem o proprio nivel
# de evidencia e nunca fica acima da fonte mais forte que o sustenta.
schema_version: 1
ref: belt_load_low
internal_code: BELT_LOAD_LOW
title_pt: "Pouco material sobre a correia"
text_pt: >-
  O KCM está aumentando o esforço para tentar compensar a redução de material sobre a correia.
  A vazão costuma ser preservada no início; se a carga continuar caindo, o acionamento chega ao teto
  e a vazão passa a cair também.
sources:
  - id: SRC-RULE-R-BELTLOAD-001
    kind: rule
    title: "Regra Forja 'Pouco material sobre a correia'"
    reference: "config/rules/R-BELTLOAD-001.yaml"
    evidence_level: FORJA_RULE
  - id: SRC-CASE-GTEX-2026-09
    kind: field_observation
    title: "Caso de campo GTEX/PHA Pó Base, 09/2026 (alarme 56 observado; causa confirmada desconhecida)"
    reference: "knowledge/cases/2026-09_gtex_pha_po_base_velocidade.yaml"
    evidence_level: FIELD_OBSERVED
  - id: SRC-OPINION-BELT-LOAD
    kind: opinion
    title: "Opinião técnica Forja sobre o padrão material na correia em queda com esforço do acionamento em alta"
    reference: "Documento Mestre §18.1"
    evidence_level: TECHNICAL_OPINION
hypotheses:
  - id: H1
    text_pt: "Comportamento compatível com redução da alimentação de material a montante (menos material chegando à correia)."
    evidence_level: HYPOTHESIS
    rationale_pt: "Com menos material entrando, a carga medida na correia cai de verdade e o controlador acelera o acionamento para manter a vazão pedida."
    verification_ids: [V1, V2]
    source_ids: [SRC-OPINION-BELT-LOAD, SRC-RULE-R-BELTLOAD-001]
  - id: H2
    text_pt: "Comportamento compatível com problema na cadeia de medição de carga (célula de pesagem SFT, cabo, conector, interface)."
    evidence_level: HYPOTHESIS
    rationale_pt: "Se a medição de carga cai sem o material cair de fato, o controlador reage ao número e não ao processo. No caso GTEX houve reparo de conector e cabo da célula de carga no mesmo atendimento."
    verification_ids: [V3, V4, V5]
    source_ids: [SRC-OPINION-BELT-LOAD, SRC-CASE-GTEX-2026-09]
  - id: H3
    text_pt: "Comportamento compatível com problema mecânico na correia ou no transporte do material (deslizamento, acúmulo, obstrução)."
    evidence_level: HYPOTHESIS
    rationale_pt: "Transporte irregular muda a carga por metro sem mudar o que entra. A Forja não distingue isso só pelos dados do KCM."
    verification_ids: [V1, V6]
    source_ids: [SRC-OPINION-BELT-LOAD]
next_checks:
  - id: V1
    order: 1
    text_pt: "Olhar a máquina: há material chegando e distribuído sobre a correia? A alimentação a montante está normal?"
    how_pt: "Inspeção visual com a máquina em operação, sem tocar em nada."
    safety_pt: "Conforme procedimento da planta."
    evidence_level: TECHNICAL_OPINION
    source_ids: [SRC-OPINION-BELT-LOAD]
  - id: V2
    order: 2
    text_pt: "Conferir na tela do KCM a carga na correia, o esforço do acionamento e os alarmes ativos no momento."
    how_pt: "Anotar valores e horário; comparar com o que a Forja registrou."
    safety_pt: "Conforme procedimento da planta."
    evidence_level: TECHNICAL_OPINION
    source_ids: [SRC-OPINION-BELT-LOAD]
  - id: V3
    order: 3
    text_pt: "Verificar o cabo da célula de pesagem (SFT) no trajeto até o KCM."
    how_pt: "Procurar dano, esmagamento ou emenda. No caso GTEX houve emenda na rota MDU/Scale."
    safety_pt: "Conforme procedimento da planta."
    evidence_level: TECHNICAL_OPINION
    source_ids: [SRC-OPINION-BELT-LOAD, SRC-CASE-GTEX-2026-09]
  - id: V4
    order: 4
    text_pt: "Verificar o conector da célula de pesagem e as conexões intermediárias."
    how_pt: "Folga, oxidação, pino recuado. Reparo de conector foi uma das intervenções no caso GTEX."
    safety_pt: "Conforme procedimento da planta."
    evidence_level: TECHNICAL_OPINION
    source_ids: [SRC-OPINION-BELT-LOAD, SRC-CASE-GTEX-2026-09]
  - id: V5
    order: 5
    text_pt: "Verificar a interface da balança (SIB/Scale), se aplicável nesta instalação."
    how_pt: "A presença de SIB nesta instalação ainda não é conhecida; confirmar antes de procurar."
    safety_pt: "Conforme procedimento da planta."
    evidence_level: TECHNICAL_OPINION
    source_ids: [SRC-OPINION-BELT-LOAD]
  - id: V6
    order: 6
    text_pt: "Verificar mecanicamente a correia: tensão, deslizamento, acúmulo ou obstrução no trajeto do material."
    how_pt: "Somente com a máquina parada."
    safety_pt: "Conforme procedimento da planta."
    evidence_level: TECHNICAL_OPINION
    source_ids: [SRC-OPINION-BELT-LOAD]
  - id: V7
    order: 7
    text_pt: "Consultar, somente leitura, os registros de calibração do KCM: tara, span e correlação."
    how_pt: "Ler no menu do KCM. Não executar calibração nem tara a partir deste diagnóstico."
    safety_pt: "Conforme procedimento da planta."
    evidence_level: TECHNICAL_OPINION
    source_ids: [SRC-OPINION-BELT-LOAD]
caveats:
  - "O alarme 56 (texto exibido pelo KCM: 'BELTLOAD LOW'), quando informado pelo KCM, é dado do KCM com limite interno desconhecido pela Forja."
  - "O simulador reproduz este padrão com um modelo simplificado (vazão ≈ material na correia × velocidade da correia); o KCM real usa algoritmo proprietário."
related_rules: [R-BELTLOAD-001]
related_cases: [CASE-2026-09-GTEX-PHA-PO-BASE-VELOCIDADE]
